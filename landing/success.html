<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Complete — Qvault</title>
  <style>
    :root {
      --navy: #0F1B2D;
      --blue-accent: #3B82F6;
      --green: #10B981;
      --gray-50: #F9FAFB;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --white: #FFFFFF;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--gray-800); line-height: 1.6; background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--navy); padding: 1rem 2rem; }
    nav a { color: white; text-decoration: none; font-size: 1.25rem; font-weight: 700; }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: var(--white); border-radius: 16px; padding: 3rem; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    .icon { width: 64px; height: 64px; border-radius: 50%; background: #D1FAE5; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--gray-900); }
    .subtitle { color: var(--gray-500); margin-bottom: 2rem; }
    .key-box { background: var(--gray-50); border: 2px solid var(--gray-200); border-radius: 12px; padding: 1.25rem; margin: 1.5rem 0; position: relative; }
    .key-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); margin-bottom: 0.5rem; }
    .key-value { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 1.5rem; font-weight: 700; color: var(--gray-900); letter-spacing: 0.05em; word-break: break-all; }
    .copy-btn { margin-top: 1rem; padding: 0.5rem 1.25rem; background: var(--blue-accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .copy-btn:hover { background: #2563EB; }
    .instructions { text-align: left; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200); }
    .instructions h3 { font-size: 0.9rem; margin-bottom: 0.75rem; color: var(--gray-900); }
    .instructions ol { padding-left: 1.25rem; color: var(--gray-600); font-size: 0.9rem; }
    .instructions li { margin-bottom: 0.5rem; }
    .email-note { margin-top: 1rem; font-size: 0.85rem; color: var(--gray-400); }
    .loading { color: var(--gray-500); }
    .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--gray-200); border-top-color: var(--blue-accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #DC2626; font-size: 0.9rem; }
    footer { background: var(--navy); color: rgba(255,255,255,0.5); text-align: center; padding: 1.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav><a href="index.html">Qvault</a></nav>

  <div class="container">
    <div class="card" id="content">
      <div class="loading">
        <p><span class="spinner"></span> Confirming your purchase...</p>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Qvault. All rights reserved.</footer>

  <script>
    const API = "https://api.qvault.tech";

    async function loadSessionInfo() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");

      if (!sessionId) {
        showError("No session ID found. If you just completed a purchase, please check your email.");
        return;
      }

      let attempts = 0;
      const maxAttempts = 10;

      async function tryFetch() {
        try {
          const res = await fetch(API + "/api/stripe/session-info?session_id=" + encodeURIComponent(sessionId));
          if (res.ok) {
            const data = await res.json();
            showSuccess(data);
            return;
          }

          // Webhook might not have processed yet — retry
          attempts++;
          if (attempts < maxAttempts) {
            setTimeout(tryFetch, 2000);
          } else {
            showError("Your payment was successful but the license key is still being generated. Please check your email or contact support.");
          }
        } catch (e) {
          attempts++;
          if (attempts < maxAttempts) {
            setTimeout(tryFetch, 2000);
          } else {
            showError("Could not retrieve your license key. Please contact support.");
          }
        }
      }

      tryFetch();
    }

    function showSuccess(data) {
      document.getElementById("content").innerHTML = `
        <div class="icon">&#10003;</div>
        <h1>Purchase Complete!</h1>
        <p class="subtitle">Thank you for choosing Qvault. Your license key is ready.</p>

        <div class="key-box">
          <div class="key-label">Your License Key</div>
          <div class="key-value" id="license-key">${data.license_key}</div>
          <button class="copy-btn" onclick="copyKey()">Copy to Clipboard</button>
        </div>

        ${data.email ? '<p class="email-note">A copy has been sent to ' + data.email + '</p>' : ''}

        <div class="instructions">
          <h3>How to activate:</h3>
          <ol>
            <li>Open Qvault on your computer</li>
            <li>Go to <strong>Settings</strong> (gear icon)</li>
            <li>Click <strong>Activate License</strong></li>
            <li>Paste your license key and click <strong>Activate</strong></li>
          </ol>
        </div>
      `;
    }

    function showError(msg) {
      document.getElementById("content").innerHTML = `
        <div class="icon" style="background:#FEE2E2">&#9888;</div>
        <h1>Almost There</h1>
        <p class="error">${msg}</p>
        <p style="margin-top:1rem;color:var(--gray-500);font-size:0.9rem">
          If you need help, contact us at <a href="https://qvault.tech">qvault.tech</a>
        </p>
      `;
    }

    function copyKey() {
      const key = document.getElementById("license-key").textContent;
      navigator.clipboard.writeText(key).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy to Clipboard", 2000);
      });
    }

    loadSessionInfo();
  </script>
</body>
</html>
