name: Deploy Website

# Mirrors the GitHub Pages site (site/, built by node site/build.mjs) to
# qvault.tech. Files are added or replaced, never deleted, so the server's
# releases/ and docs/ folders are kept.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site to qvault.tech
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          node site/build.mjs
          node site/check-links.mjs

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -rlt --checksum -e "ssh -i ~/.ssh/deploy_key" site/dist/ "root@${DEPLOY_HOST}:/var/www/qvault.tech/"
