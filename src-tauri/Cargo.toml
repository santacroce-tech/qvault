[package]
name = "qvault"
version = "0.2.2"
description = "Detect and redact PII from documents"
authors = ["Qvault"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
lopdf = "0.32"
quick-xml = "0.31"
zip = "0.6"
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
tauri-plugin-opener = "2"

# Desktop-only: HTTPS model downloads for the QVAC sidecar (Layer 3 / OCR).
# Mobile builds do not ship the sidecar and never download models.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
