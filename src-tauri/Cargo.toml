[package]
name = "qvault"
version = "0.2.0"
description = "Detect and redact PII from documents"
authors = ["Qvault"]
license = "MIT"
edition = "2021"
# Bumped to 1.88 for ort-tract (pure-Rust ONNX backend, required for
# x86_64-apple-darwin support since ort 2.0 dropped Intel Mac binaries).
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
lopdf = "0.32"
quick-xml = "0.31"
zip = "0.6"
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
tauri-plugin-opener = "2"
# ort + ort-tract: pure-Rust ONNX runtime, no native binary download.
# Works on every target (incl. x86_64-apple-darwin). CPU-only.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "alternative-backend"], optional = true }
ort-tract = { version = "0.3", optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.4", optional = true }

[features]
default = ["llm"]
llm = ["dep:ort", "dep:ort-tract", "dep:ndarray", "dep:tokenizers", "dep:hf-hub"]
# NOTE: cuda/metal acceleration was dropped when we moved to the tract
# backend (tract is CPU-only). Kept as aliases for `llm` so build scripts
# that pass --features cuda|metal still work.
cuda = ["llm"]
metal = ["llm"]
